<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi 3D AAS Nyala – Analisis Tembaga (Cu)</title>
<style>
:root{--bg:#0e1621;--panel:#152131;--text:#e7edf4;--muted:#8fa1b5;--accent:#d98a45;--ok:#5bd68a;--border:#27384d;--field:#0e1621}
[data-theme=light]{--bg:#e9eef3;--panel:#fff;--text:#18222e;--muted:#5d6e80;--accent:#a8581a;--ok:#1f9d57;--border:#cfd9e3;--field:#f3f6f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:1fr 390px;height:100vh}
#viewport{position:relative;overflow:hidden;min-height:300px}
#viewport canvas{display:block}
#panel{background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px 16px 24px}
h1{font-size:17px;margin:0 0 2px}
h2{font-size:13px;margin:18px 0 8px;color:var(--accent)}
p.sub{margin:0;color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
button,select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#111}
button.primary{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.read{display:flex;justify-content:space-between;align-items:baseline;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
#outA{font:700 30px ui-monospace,Consolas,monospace;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 6px;border-bottom:1px solid var(--border);text-align:left}
#eq{font-family:ui-monospace,Consolas,monospace;margin:8px 0 2px}
#result{color:var(--ok);font-weight:600;min-height:20px}
#chartBox{position:relative;height:230px}
ol{margin:0;padding-left:20px}
ol li{color:var(--muted);padding:2px 0}
ol li.done{color:var(--ok);text-decoration:line-through}
ol li.now{color:var(--text);font-weight:600}
#info{background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
#info b{display:block;margin-bottom:2px}
.label{background:rgba(10,16,24,.78);color:#fff;font:12px system-ui,sans-serif;padding:2px 7px;border-radius:4px;white-space:nowrap;cursor:pointer;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#111c;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media(max-width:800px){body{overflow:auto}#app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--border);overflow:visible}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <div id="viewport" aria-label="Tampilan 3D alat AAS"></div>
  <aside id="panel">
    <h1>Simulasi AAS Nyala – Cu 324,7 nm</h1>
    <p class="sub">Seret untuk memutar, scroll/cubit untuk zoom, klik komponen untuk penjelasan.</p>

    <h2>Alat</h2>
    <div class="row">
      <button id="btnLamp">Lampu HCL: OFF</button>
      <button id="btnGas">Gas: OFF</button>
      <button id="btnFlame">Api: OFF</button>
      <button id="btnOpt">Optimasi</button>
    </div>

    <h2>Sampel</h2>
    <select id="selSample" aria-label="Pilih sampel">
      <option value="blank">Blanko</option>
      <option value="s1">Standar 1 (1 ppm)</option><option value="s2">Standar 2 (2 ppm)</option>
      <option value="s3">Standar 3 (3 ppm)</option><option value="s4">Standar 4 (4 ppm)</option>
      <option value="s5">Standar 5 (5 ppm)</option>
      <option value="unknown">Sampel tak dikenal</option>
      <option value="manual">Manual (slider)</option>
    </select>
    <div class="row" style="align-items:center"><label for="rngConc" style="flex:1">Konsentrasi Cu: <b id="outConc">0.00</b> ppm</label></div>
    <input id="rngConc" type="range" min="0" max="10" step="0.05" value="0">
    <div class="read" style="margin-top:10px"><span>Absorbansi</span><span id="outA">0.0000</span></div>
    <div class="row"><button id="btnMeasure" class="primary">Ukur &amp; catat</button><button id="btnClear">Hapus data</button></div>

    <h2>Kurva kalibrasi</h2>
    <div id="chartBox"><canvas id="chart"></canvas></div>
    <div id="eq">y = ax + b</div>
    <div id="result"></div>
    <table><thead><tr><th>Data</th><th>A (terkoreksi blanko)</th></tr></thead><tbody id="calBody"></tbody></table>

    <h2>Panduan</h2>
    <div class="row">
      <button id="btnSteps" class="on">Langkah kerja</button>
      <button id="btnExplain" class="on">Penjelasan</button>
    </div>
    <ol id="steps"></ol>
    <div id="info"><b id="infoTitle">Penjelasan komponen</b><span id="infoText">Klik komponen 3D atau labelnya.</span></div>

    <h2>Tampilan</h2>
    <div class="row">
      <button id="btnReset">Reset kamera</button>
      <button id="btnLabels" class="on">Label</button>
      <button id="btnTheme">Tema gelap/terang</button>
    </div>
  </aside>
</div>
<div id="toast" role="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
